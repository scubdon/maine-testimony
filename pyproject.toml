[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maine-testimony"
version = "0.1.0"
description = "Scraper, cleaned dataset, and analysis of public testimony submitted to Maine Legislature committees."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "pypdf>=4.0",
    "cryptography>=3.1",  # pypdf needs it to open AES-encrypted PDFs
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
ocr = ["ocrmypdf>=17"]  # also needs Tesseract: brew install tesseract / apt install tesseract-ocr
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "anthropic>=1.0"]

[project.scripts]
mtestimony = "maine_testimony.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/maine_testimony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
