name: Weekly health check

# A light weekly check that the Legislature's undocumented endpoints still answer the way
# the pipeline expects, and that every step still runs. It commits NOTHING: data/public/ is
# exported from the maintainer's local database (full crawl, FineReader OCR, Claude
# positions) and committed by hand. Bulk PDF downloads and OCR happen locally too.
#
# The run fails if the crawl reports any failed hearing, or if none of the sampled PDFs
# downloads and parses. The working SQLite database holds private individuals' names, so
# it lives only in the Actions cache (kept so the crawl stays incremental).

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC (off the hour, to spread load)
  workflow_dispatch:
    inputs:
      doc_sample:
        description: "PDFs to download as a sample"
        default: "20"

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MTESTIMONY_CONTACT: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore working database
        uses: actions/cache/restore@v4
        with:
          path: data/testimony.sqlite
          key: testimony-db-${{ github.run_id }}
          restore-keys: testimony-db-

      # Listing endpoints: sessions, committees, hearing dates, testimony records.
      - name: Crawl listings (incremental)
        run: |
          out=$(mtestimony -v crawl --rate 1.0 --no-cache)
          echo "$out"
          echo "$out" | grep -q "errors=0;" || { echo "::error::crawl reported failed hearings"; exit 1; }

      - name: Classify submitters
        run: mtestimony classify

      # PDF endpoint + pypdf parsing, on a small random sample. No OCR here.
      - name: Download a sample of PDFs
        run: |
          out=$(mtestimony fetch-docs --rate 1.0 --random --no-ocr --limit ${{ inputs.doc_sample || '20' }})
          echo "$out"
          if [ "$out" = "{}" ]; then
            echo "::warning::every listed PDF is already in the database; nothing to sample"
          elif ! echo "$out" | grep -q "'ok': [1-9]"; then
            echo "::error::no sampled PDF downloaded and parsed"; exit 1
          fi

      # Derived steps and the export, written outside the repo so nothing can be committed.
      - name: Derive and export (discarded)
        run: |
          mtestimony positions
          mtestimony form-letters
          mtestimony export --out "$RUNNER_TEMP/public"
          mtestimony stats

      - name: Save working database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/testimony.sqlite
          key: testimony-db-${{ github.run_id }}
